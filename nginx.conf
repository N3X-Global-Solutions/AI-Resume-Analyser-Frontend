server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Upload batches are capped client-side at 20 files / ~100 MB (a single ZIP may be up to 100 MB).
  client_max_body_size 250m;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # API → FastAPI backend (docker-compose service name "backend").
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # LLM-backed endpoints (extract requirements, AI search, rank explanation) can be slow.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_request_buffering off;
  }

  # Hashed assets can be cached forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA fallback for client-side routes.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
